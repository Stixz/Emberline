    /* Base styles will be injected dynamically */

  <div class="title-bar">
    <div class="title-bar-drag">
      <span class="title-bar-title">Emberline Works : A Google gateway.</span>
    </div>
    <div class="title-bar-controls">
      <button class="title-bar-btn" id="btn-minimize">─</button>
      <button class="title-bar-btn" id="btn-maximize">□</button>
      <button class="title-bar-btn title-bar-btn-close" id="btn-close">✕</button>
    </div>
  </div>
  <div class="container">
    <header>
      <div class="header-controls">
        <button id="settings-btn" class="settings-btn">⚙️ Settings</button>
      </div>
    </header>

    <div id="main-content">
      <!-- Apps will be dynamically generated here -->
    </div>

    <footer>
      <p>© 2025 Ravenforge Creations Studio</p>
    </footer>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Settings</h2>
        <span class="close">&times;</span>
      </div>
      <div class="modal-body">
        <div class="settings-section">
          <h3>Theme</h3>
          <select id="theme-select">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
            <option value="ocean">Ocean</option>
            <option value="sunset">Sunset</option>
            <option value="forest">Forest</option>
            <option value="neon">Neon</option>
            <option value="rose">Rose</option>
            <option value="midnight">Midnight</option>
            <option value="cyberpunk">Cyberpunk</option>
            <option value="retro">Retro Terminal</option>
            <option value="nord">Nord</option>
            <option value="dracula">Dracula</option>
            <option value="solarized">Solarized</option>
            <option value="glass">Glass</option>
            <option value="lavender">Lavender</option>
            <option value="coffee">Coffee</option>
            <option value="arctic">Arctic</option>
            <option value="custom">Custom</option>
          </select>
        </div>

        <div class="settings-section" id="custom-colors" style="display: none;">
          <h3>Custom Colors</h3>
          <div class="color-picker">
            <label>Primary: <input type="color" id="primary-color"></label>
            <label>Secondary: <input type="color" id="secondary-color"></label>
            <label>Background: <input type="color" id="background-color"></label>
            <label>Surface: <input type="color" id="surface-color"></label>
            <label>Text: <input type="color" id="text-color"></label>
            <label>Text Secondary: <input type="color" id="text-secondary-color"></label>
          </div>
        </div>

        <div class="settings-section">
          <h3>Apps</h3>
          <button id="add-app-btn" class="add-btn">+ Add App</button>
          <div class="quick-add-panel">
            <div class="quick-add-actions">
              <button id="quick-add-core" class="quick-add-btn" type="button">+ Core Pack</button>
              <button id="quick-add-collab" class="quick-add-btn" type="button">+ Collaboration Pack</button>
              <button id="quick-add-all" class="quick-add-btn" type="button">+ Full Google Pack</button>
            </div>
            <div class="quick-add-row">
              <label for="quick-add-select">Quick Pick:</label>
              <select id="quick-add-select">
                <option value="">Select a Google app...</option>
              </select>
              <button id="quick-add-selected" class="save-btn" type="button">Add Selected</button>
            </div>
          </div>
          <div id="settings-status" class="status-banner" hidden></div>
          <div id="apps-list">
            <!-- Apps will be listed here for editing -->
          </div>
          <div id="app-editor" class="app-editor" hidden>
            <h4 id="app-form-title">Add New App</h4>
            <form id="add-app-form">
              <label>Name: <input type="text" id="app-name" required></label>
              <label>URL: <input type="url" id="app-url" required></label>
              <label>Icon: <input type="text" id="app-icon" placeholder="📱" required></label>
              <label>Description: <input type="text" id="app-description" required></label>
              <label>Category:
                <select id="app-category-select" required>
                  <option value="" disabled selected>Select a category…</option>
                  <option value="__new__">＋ New Category…</option>
                </select>
              </label>
              <label id="app-category-new-label" style="display:none">New Category Name:
                <input type="text" id="app-category-new" placeholder="e.g. Core Workspace">
              </label>
              <div class="app-editor-actions">
                <button id="save-app" type="submit" class="save-btn">Add App</button>
                <button id="cancel-app" type="button" class="cancel-btn">Cancel</button>
              </div>
            </form>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button id="save-settings" class="save-btn">Save Changes</button>
        <button id="cancel-settings" class="cancel-btn">Cancel</button>
      </div>
    </div>
  </div>

    function createDefaultConfig() {
      return {
        apps: [],
        theme: 'dark',
        customColors: {
          primary: '#60a5fa',
          secondary: '#a78bfa',
          background: '#1e293b',
          surface: '#334155',
          text: '#e2e8f0',
          textSecondary: '#94a3b8'
        }
      };
    }

    function normalizeConfig(inputConfig) {
      const base = createDefaultConfig();
      const safeConfig = inputConfig && typeof inputConfig === 'object' ? inputConfig : {};

      const apps = Array.isArray(safeConfig.apps) ? safeConfig.apps : [];

      return {
        apps: apps
          .filter((item) => item && typeof item === 'object')
          .map((item) => ({
            name: typeof item.name === 'string' ? item.name.trim() : '',
            url: typeof item.url === 'string' ? item.url.trim() : '',
            icon: typeof item.icon === 'string' ? item.icon.trim() : '',
            description: typeof item.description === 'string' ? item.description.trim() : '',
            category: typeof item.category === 'string' ? item.category.trim() : '',
            hidden: Boolean(item.hidden)
          }))
          .filter((item) => item.name && item.url && item.icon && item.description && item.category),
        theme: ['dark', 'light', 'ocean', 'sunset', 'forest', 'neon', 'rose', 'midnight', 'cyberpunk', 'retro', 'nord', 'dracula', 'solarized', 'glass', 'lavender', 'coffee', 'arctic', 'custom'].includes(safeConfig.theme) ? safeConfig.theme : base.theme,
        customColors: {
          ...base.customColors,
          ...(safeConfig.customColors || {})
        }
      };
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function setModalOpen(modalId, isOpen) {
      const modal = document.getElementById(modalId);
      if (!modal) {
        return;
      }

      modal.classList.toggle('open', isOpen);
      document.body.style.overflow = document.querySelector('.modal.open') ? 'hidden' : '';
    }

    function setAppEditorOpen(isOpen) {
      const editor = document.getElementById('app-editor');
      editor.hidden = !isOpen;

      if (isOpen) {
        requestAnimationFrame(() => {
          document.getElementById('app-name').focus();
        });
      }
    }

    function showStatus(message, type = 'info') {
      const status = document.getElementById('settings-status');
      status.textContent = message;
      status.className = `status-banner ${type}`;
      status.hidden = false;
    }

    function clearStatus() {
      const status = document.getElementById('settings-status');
      status.hidden = true;
      status.textContent = '';
      status.className = 'status-banner';
    }

    function getAppFormData() {
      const sel = document.getElementById('app-category-select');
      const category = sel.value === '__new__'
        ? document.getElementById('app-category-new').value.trim()
        : sel.value;
      return {
        name: document.getElementById('app-name').value.trim(),
        url: document.getElementById('app-url').value.trim(),
        icon: document.getElementById('app-icon').value.trim(),
        description: document.getElementById('app-description').value.trim(),
        category
      };
    }

    function isValidHttpUrl(value) {
      try {
        const parsedUrl = new URL(value);
        return ['http:', 'https:'].includes(parsedUrl.protocol);
      } catch (error) {
        return false;
      }
    }

    function isGoogleAppUrl(url) {
      try {
        const parsedUrl = new URL(url);
        const hostname = parsedUrl.hostname.toLowerCase();
        // Allow any Google domain (google.com and subdomains)
        return hostname === 'google.com' || hostname.endsWith('.google.com');
      } catch {
        return false;
      }
    }

    function validateAppData(appData) {
      if (!appData.name || !appData.url || !appData.icon || !appData.description || !appData.category) {
        return 'All app fields are required.';
      }

      if (!isValidHttpUrl(appData.url)) {
        return 'App URL must start with http:// or https://.';
      }

      if (!isGoogleAppUrl(appData.url)) {
        return 'Only Google app URLs are allowed (e.g., mail.google.com, docs.google.com).';
      }

      return null;
    }

    function getUrlKey(url) {
      try {
        const parsedUrl = new URL(url.trim());
        const cleanPath = parsedUrl.pathname.replace(/\/+$/, '') || '/';
        return `${parsedUrl.hostname.toLowerCase()}${cleanPath}${parsedUrl.search}`;
      } catch {
        return String(url || '').trim().toLowerCase();
      }
    }

    function getLibraryAppById(appId) {
      return GOOGLE_APP_LIBRARY.find((app) => app.id === appId) || null;
    }

    function renderQuickAddOptions() {
      const quickAddSelect = document.getElementById('quick-add-select');
      if (!quickAddSelect || !config) {
        return;
      }

      const existingAppsByUrlKey = new Map(
        (Array.isArray(config.apps) ? config.apps : []).map((app) => [getUrlKey(app.url), app])
      );

      let html = '<option value="">Select a Google app...</option>';
      GOOGLE_APP_LIBRARY.forEach((app) => {
        const existingApp = existingAppsByUrlKey.get(getUrlKey(app.url));
        const alreadyActive = existingApp && !existingApp.hidden;
        const isHidden = existingApp && existingApp.hidden;
        const statusLabel = alreadyActive ? ' (active)' : (isHidden ? ' (hidden)' : '');

        html += `<option value="${escapeHtml(app.id)}"${alreadyActive ? ' disabled' : ''}>${escapeHtml(app.name)}${statusLabel} - ${escapeHtml(app.category)}</option>`;
      });

      quickAddSelect.innerHTML = html;
      quickAddSelect.value = '';
    }

    function addAppsFromLibrary(appsToAdd, sourceLabel) {
      config = normalizeConfig(config);

      if (!Array.isArray(appsToAdd) || appsToAdd.length === 0) {
        showStatus('No apps were selected to add.', 'info');
        return;
      }

      const existingAppIndexByUrlKey = new Map(
        config.apps.map((app, index) => [getUrlKey(app.url), index])
      );
      let addedCount = 0;
      let restoredCount = 0;
      let skippedCount = 0;

      appsToAdd.forEach((app) => {
        const appData = {
          name: app.name,
          url: app.url,
          icon: app.icon,
          description: app.description,
          category: app.category,
          hidden: false
        };

        if (validateAppData(appData)) {
          skippedCount += 1;
          return;
        }

        const urlKey = getUrlKey(appData.url);
        if (existingAppIndexByUrlKey.has(urlKey)) {
          const existingIndex = existingAppIndexByUrlKey.get(urlKey);
          if (config.apps[existingIndex] && config.apps[existingIndex].hidden) {
            config.apps[existingIndex].hidden = false;
            restoredCount += 1;
          } else {
            skippedCount += 1;
          }
          return;
        }

        existingAppIndexByUrlKey.set(urlKey, config.apps.length);
        config.apps.push(appData);
        addedCount += 1;
      });

      renderAppsList();
      renderQuickAddOptions();

      if (addedCount > 0 && restoredCount === 0 && skippedCount === 0) {
        showStatus(`Added ${addedCount} app${addedCount === 1 ? '' : 's'} from ${sourceLabel}. Save Changes to keep them.`, 'success');
        return;
      }

      if (addedCount > 0 || restoredCount > 0) {
        const changeParts = [];
        if (addedCount > 0) {
          changeParts.push(`added ${addedCount} app${addedCount === 1 ? '' : 's'}`);
        }
        if (restoredCount > 0) {
          changeParts.push(`restored ${restoredCount} hidden`);
        }
        if (skippedCount > 0) {
          changeParts.push(`skipped ${skippedCount} already active`);
        }

        showStatus(`${changeParts.join(', ')} from ${sourceLabel}. Save Changes to keep updates.`, 'success');
        return;
      }

      showStatus(`All apps from ${sourceLabel} are already in your list.`, 'info');
    }

    function resetAppForm() {
      editingAppIndex = null;
      document.getElementById('add-app-form').reset();
      document.getElementById('app-form-title').textContent = 'Add New App';
      document.getElementById('save-app').textContent = 'Add App';
      populateCategoryDropdown();
    }

    function populateAppForm(app) {
      document.getElementById('app-name').value = app.name;
      document.getElementById('app-url').value = app.url;
      document.getElementById('app-icon').value = app.icon;
      document.getElementById('app-description').value = app.description;
      populateCategoryDropdown(app.category);
    }

    function populateCategoryDropdown(selectedCategory) {
      const sel = document.getElementById('app-category-select');
      const apps = Array.isArray(config.apps) ? config.apps : [];
      const cats = [...new Set(apps.map(a => a.category).filter(Boolean))].sort();

      let html = '<option value="" disabled>Select a category…</option>';
      cats.forEach(cat => {
        const selected = cat === selectedCategory ? ' selected' : '';
        html += `<option value="${escapeHtml(cat)}"${selected}>${escapeHtml(cat)}</option>`;
      });
      html += '<option value="__new__">＋ New Category…</option>';
      sel.innerHTML = html;

      const newLabel = document.getElementById('app-category-new-label');
      const newInput = document.getElementById('app-category-new');

      if (selectedCategory && !cats.includes(selectedCategory)) {
        // Not in list yet — show as new category with value pre-filled
        sel.value = '__new__';
        newLabel.style.display = '';
        newInput.value = selectedCategory;
      } else {
        newLabel.style.display = 'none';
        newInput.value = '';
      }
    }

    // Load config and initialize
    async function loadConfig() {
      const loadedConfig = await window.electronAPI.getConfig();
      config = normalizeConfig(loadedConfig);
      originalConfig = JSON.parse(JSON.stringify(config)); // Deep copy
      applyTheme();
      renderApps();
    }

          font-weight: 600;

        }

        .title-bar-controls {
          display: flex;

          background: ${colors.primary};
          color: white;
        }

        .title-bar-btn-close:hover {
          background: #ef4444;
          color: white;
        }

        .container {
          max-width: 1000px;
          margin: 0 auto;
          padding: 16px 30px;
        }

        header {
          margin-bottom: 20px;
          text-align: right;
          position: sticky;
          top: 0;
          z-index: 100;
          padding: 8px 0;
        }

        h1 {
          font-size: 2.5em;
          font-weight: 700;
          margin-bottom: 10px;
          background: linear-gradient(135deg, ${colors.primary} 0%, ${colors.secondary} 100%);

          -webkit-text-fill-color: transparent;
          background-clip: text;

        .subtitle {
          font-size: 1em;
          color: ${colors.textSecondary};
          font-weight: 400;
        }

        .header-controls {
          display: flex;
          justify-content: flex-end;
        }

        .settings-btn {
          background: ${colors.surface};
          border: 1px solid ${colors.textSecondary};

          border-radius: 9999px;

        .settings-btn:hover {
          background: ${colors.primary};

        }

        .apps-grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
          gap: 20px;
          margin-top: 40px;
        }

        .app-card {
          background: linear-gradient(135deg, ${colors.surface} 0%, ${colors.background} 100%);
          border: none;
          border-radius: 16px;
          padding: 25px;
          cursor: pointer;
          transition: all 0.3s ease;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          text-decoration: none;
          color: inherit;
          position: relative;
          overflow: hidden;
        }

        .app-card::before {
          content: '';
          position: absolute;
          top: 0;
          left: -100%;
          width: 100%;
          height: 100%;
          background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
          transition: left 0.4s ease;
        }

        .app-card:hover::before {
          left: 100%;

        .app-card:hover {
          transform: translateY(-8px);
          box-shadow: 0 12px 24px rgba(96, 165, 250, 0.2);
          background: linear-gradient(135deg, ${colors.background} 0%, ${colors.surface} 100%);

        .app-icon {
          font-size: 3.5em;
          margin-bottom: 15px;
          display: block;
          transition: transform 0.3s ease;
        }

        .app-card:hover .app-icon {

        }

        .app-name {
          font-size: 1.1em;
          font-weight: 600;
          margin-bottom: 8px;
          color: ${colors.text};
        }

        .app-description {
          font-size: 0.85em;
          color: ${colors.textSecondary};
          line-height: 1.4;
        }

        .section-title {
          font-size: 1.3em;
          font-weight: 600;
          color: ${colors.text};
          margin-top: 40px;
          margin-bottom: 20px;
          padding-bottom: 10px;
          border-bottom: none;
        }

        footer {
          text-align: center;
          padding: 12px;
          border-top: none;
          color: ${colors.textSecondary};
          font-size: 0.9em;
          position: fixed;
          bottom: 0;
          left: 0;
          right: 0;
          background: ${colors.background};
          z-index: 9999;
        }

        /* Modal styles */
        .modal {

          position: fixed;
          z-index: 1000;
          left: 0;
          top: 0;

        }

        .modal.open {
          display: block;
        }

        .modal-content {
          background-color: ${colors.surface};

          padding: 0;
          border: 1px solid ${colors.textSecondary};
          border-radius: 12px;
          width: 90%;
          max-width: 600px;
          color: ${colors.text};
          max-height: 80vh;
          overflow-y: auto;
          scrollbar-width: none;
          -ms-overflow-style: none;

        .modal-header h2 {

        .close {

          font-size: 28px;
          font-weight: bold;
          cursor: pointer;
        }

        .close:hover {
          color: ${colors.primary};
        }

        .modal-body {
          padding: 20px;
        }

        .modal-footer {
          padding: 20px;
          border-top: 1px solid ${colors.textSecondary};
          text-align: right;
        }

        .settings-section {
          margin-bottom: 20px;
        }

        .settings-section h3 {
          margin-bottom: 10px;
          color: ${colors.text};
        }

        select, input[type="text"], input[type="url"] {
          width: 100%;
          padding: 8px;
          border: 1px solid ${colors.textSecondary};
          border-radius: 4px;
          background: ${colors.background};
          color: ${colors.text};

        }

        .color-picker {

          grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));

        }

        .color-picker label {

        }

        .add-btn, .save-btn, .cancel-btn {
          padding: 8px 18px;

          cursor: pointer;

        }

        .add-btn {
          background: ${colors.primary};
          color: white;
        }

        .quick-add-panel {
          margin-top: 10px;

          padding: 12px;
          border: 1px solid ${colors.textSecondary};

        }

        .quick-add-actions {

        }

        .quick-add-row {

        }

        .quick-add-row select {
          margin-bottom: 0;
        }

        .quick-add-row .save-btn {
          margin-right: 0;
        }

        .save-btn {
          background: ${colors.primary};
          color: white;
        }

        .cancel-btn {
          background: ${colors.textSecondary};
          color: ${colors.surface};
        }

        .app-item {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 10px;
          border: 1px solid ${colors.textSecondary};
          border-radius: 4px;
          margin-bottom: 10px;
          background: ${colors.background};
        }

        .app-item-info {
          flex-grow: 1;
        }

        .app-state {
          display: inline-block;
          margin-left: 8px;
          font-size: 0.8em;

        .app-item-actions {
          display: flex;
          gap: 5px;
        }

        .edit-btn, .toggle-btn {
          padding: 4px 12px;
          border: none;
          border-radius: 9999px;
          cursor: pointer;
          font-size: 0.8em;
        }

        .edit-btn {
          background: ${colors.secondary};
          color: white;
        }

        .toggle-btn {
          background: ${colors.primary};
          color: white;
        }

        .app-editor {
          margin-top: 16px;
          padding: 16px;
          border: 1px solid ${colors.textSecondary};
          border-radius: 8px;
          background: ${colors.surface};
        }

        .app-editor h4 {
          margin-bottom: 12px;
          color: ${colors.text};
        }

        .app-editor-actions {
          display: flex;
          justify-content: flex-end;
          gap: 10px;
          margin-top: 8px;
        }

        .status-banner {
          margin: 12px 0;
          padding: 10px 12px;
          border-radius: 8px;
          border: 1px solid ${colors.textSecondary};
          background: ${colors.background};
          color: ${colors.text};
          font-size: 0.9em;
        }

        .status-banner.success {
          border-color: #22c55e;
          color: #bbf7d0;
        }

        .status-banner.error {
          border-color: #ef4444;
          color: #fecaca;
        }

        .status-banner.info {
          border-color: ${colors.primary};
          color: ${colors.text};
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
          .container {
            padding: 20px;
          }

          h1 {
            font-size: 2em;
          }

          .apps-grid {
            grid-template-columns: 1fr;
            gap: 15px;
          }

          .app-card {
            padding: 20px;
          }

          .app-icon {
            font-size: 3em;
          }

          .color-picker {
            grid-template-columns: 1fr;
          }

          .quick-add-row {
            flex-direction: column;
            align-items: stretch;
          }
        }
      `;

      document.getElementById('dynamic-styles').textContent = css;
    }

    // Render apps dynamically
    function renderApps() {
      const mainContent = document.getElementById('main-content');
      const categories = {};
      const apps = (Array.isArray(config.apps) ? config.apps : []).filter((app) => !app.hidden);

      apps.forEach(app => {
        if (!categories[app.category]) {
          categories[app.category] = [];
        }
        categories[app.category].push(app);
      });

      let html = '';
      for (const [category, apps] of Object.entries(categories)) {
        html += `<section>
          <h2 class="section-title">${escapeHtml(category)}</h2>
          <div class="apps-grid">`;

        apps.forEach(app => {
        html += `
        <div class="app-card" data-app-url="${escapeHtml(app.url)}" data-app-name="${escapeHtml(app.name)}">
        ${app.icon.startsWith('http') ? `<img class="app-icon" src="${escapeHtml(app.icon)}" alt="${escapeHtml(app.name)} icon" />` : `<span class="app-icon">${escapeHtml(app.icon)}</span>`}
        <div class="app-name">${escapeHtml(app.name)}</div>
        <div class="app-description">${escapeHtml(app.description)}</div>
        </div>`;
    });

        html += `</div></section>`;
      }

      if (!html) {
        html = '<section><h2 class="section-title">No active apps</h2><p class="app-description">Open Settings and use Quick Add or unhide modules.</p></section>';
      }

      mainContent.innerHTML = html;
    }

    // Settings modal functionality
    function openSettings() {
      clearStatus();
      document.getElementById('theme-select').value = config.theme;
      document.getElementById('custom-colors').style.display = config.theme === 'custom' ? 'block' : 'none';

      if (config.customColors) {
        document.getElementById('primary-color').value = config.customColors.primary;
        document.getElementById('secondary-color').value = config.customColors.secondary;
        document.getElementById('background-color').value = config.customColors.background;
        document.getElementById('surface-color').value = config.customColors.surface;
        document.getElementById('text-color').value = config.customColors.text;
        document.getElementById('text-secondary-color').value = config.customColors.textSecondary;
      }

      renderAppsList();
      renderQuickAddOptions();
      setModalOpen('settings-modal', true);
    }

    function closeSettings() {
      config = JSON.parse(JSON.stringify(originalConfig)); // Reset changes
      closeAddAppModal();
      clearStatus();
      setModalOpen('settings-modal', false);
    }

    function renderAppsList() {
      const appsList = document.getElementById('apps-list');
      let html = '';
      const apps = Array.isArray(config.apps) ? config.apps : [];

      apps.forEach((app, index) => {
        html += `
          <div class="app-item">
            <div class="app-item-info">
              <strong>${escapeHtml(app.name)}</strong> - ${escapeHtml(app.category)}
              <span class="app-state">${app.hidden ? 'Hidden' : 'Active'}</span>
            </div>
            <div class="app-item-actions">
              <button class="edit-btn" type="button" data-action="edit" data-index="${index}">Edit</button>
              <button class="toggle-btn" type="button" data-action="toggle-hidden" data-index="${index}">${app.hidden ? 'Unhide' : 'Hide'}</button>
            </div>
          </div>`;
      });

      appsList.innerHTML = html;
    }

    async function saveSettings() {
    config = normalizeConfig(config);

    // Update theme
    config.theme = document.getElementById('theme-select').value;

    // Update custom colors if custom theme
    if (config.theme === 'custom') {
        config.customColors = {
        primary: document.getElementById('primary-color').value,
        secondary: document.getElementById('secondary-color').value,
        background: document.getElementById('background-color').value,
        surface: document.getElementById('surface-color').value,
        text: document.getElementById('text-color').value,
        textSecondary: document.getElementById('text-secondary-color').value
        };
    }

    // Validate all apps before saving
    for (const app of config.apps) {
        if (!app.name || !app.url || !app.icon || !app.description || !app.category) {
        showStatus('All saved apps must include name, URL, icon, description, and category.', 'error');
        return;
        }
    }

    const result = await window.electronAPI.saveConfig(config);
    if (result && result.ok) {
        config = normalizeConfig(result.config);
        originalConfig = JSON.parse(JSON.stringify(config));
        applyTheme();
        renderApps();
      closeAddAppModal();
      clearStatus();
      setModalOpen('settings-modal', false);
    } else {
        showStatus(result && result.error ? result.error : 'Failed to save settings.', 'error');
    }
    }

    function openAddAppModal() {
    renderAppsList();
    resetAppForm();
    clearStatus();
    setAppEditorOpen(true);
    }

    function closeAddAppModal() {
    setAppEditorOpen(false);
    resetAppForm();
    }

    function saveAppForm() {
    config = normalizeConfig(config);

    const appData = getAppFormData();
    const validationError = validateAppData(appData);
    if (validationError) {
      showStatus(validationError, 'error');
      return;
    }

    if (editingAppIndex === null) {
      config.apps.push({ ...appData, hidden: false });
      showStatus(`Added ${appData.name}. Save Changes to keep it.`, 'success');
    } else if (editingAppIndex >= 0 && editingAppIndex < config.apps.length) {
      config.apps[editingAppIndex] = {
        ...appData,
        hidden: Boolean(config.apps[editingAppIndex].hidden)
      };
      showStatus(`Updated ${appData.name}. Save Changes to keep it.`, 'success');
    } else {
      showStatus('Unable to save app. Reopen the app editor and try again.', 'error');
      return;
    }

    renderAppsList();
    renderQuickAddOptions();
    closeAddAppModal();
   }

    function toggleAppHidden(index) {
     config = normalizeConfig(config);

     if (index < 0 || index >= config.apps.length) {
       return;
      }

     config.apps[index].hidden = !config.apps[index].hidden;
     const appName = config.apps[index].name;
     const nextState = config.apps[index].hidden ? 'hidden' : 'active';
     showStatus(`${appName} is now ${nextState}. Save Changes to keep it.`, 'success');
      renderAppsList();
      renderQuickAddOptions();
      renderApps();
    }

    function editApp(index) {
      config = normalizeConfig(config);
      const target = config.apps[index];
      if (!target) {
        return;
      }

      editingAppIndex = index;
      document.getElementById('app-form-title').textContent = 'Edit App';
      document.getElementById('save-app').textContent = 'Save App';
      populateAppForm(target);
      clearStatus();
      setAppEditorOpen(true);
    }

    // Event listeners
    document.addEventListener('DOMContentLoaded', loadConfig);

    document.getElementById('btn-minimize').addEventListener('click', () => window.electronAPI.minimizeWindow());
    document.getElementById('btn-maximize').addEventListener('click', () => window.electronAPI.maximizeWindow());
    document.getElementById('btn-close').addEventListener('click', () => window.electronAPI.closeWindow());

    document.getElementById('settings-btn').addEventListener('click', openSettings);
    document.querySelectorAll('.close').forEach(closeBtn => {
      closeBtn.addEventListener('click', function() {
        const modal = this.closest('.modal');
        setModalOpen(modal.id, false);
      });
    });

    document.getElementById('theme-select').addEventListener('change', function() {
      document.getElementById('custom-colors').style.display = this.value === 'custom' ? 'block' : 'none';
    });

    document.getElementById('save-settings').addEventListener('click', saveSettings);
    document.getElementById('cancel-settings').addEventListener('click', closeSettings);
    document.getElementById('add-app-btn').addEventListener('click', openAddAppModal);
    document.getElementById('quick-add-core').addEventListener('click', () => {
      const coreApps = GOOGLE_APP_LIBRARY.filter((app) => app.packs.includes('core'));
      addAppsFromLibrary(coreApps, 'Core Pack');
    });
    document.getElementById('quick-add-collab').addEventListener('click', () => {
      const collaborationApps = GOOGLE_APP_LIBRARY.filter((app) => app.packs.includes('collab'));
      addAppsFromLibrary(collaborationApps, 'Collaboration Pack');
    });
    document.getElementById('quick-add-all').addEventListener('click', () => {
      addAppsFromLibrary(GOOGLE_APP_LIBRARY, 'Full Google Pack');
    });
    document.getElementById('quick-add-selected').addEventListener('click', () => {
      const selectedAppId = document.getElementById('quick-add-select').value;
      const selectedApp = getLibraryAppById(selectedAppId);
      if (!selectedApp) {
        showStatus('Select a Google app from Quick Pick first.', 'info');
        return;
      }

      addAppsFromLibrary([selectedApp], selectedApp.name);
    });
    document.getElementById('cancel-app').addEventListener('click', closeAddAppModal);
    document.getElementById('app-category-select').addEventListener('change', function() {
      const newLabel = document.getElementById('app-category-new-label');
      const newInput = document.getElementById('app-category-new');
      if (this.value === '__new__') {
        newLabel.style.display = '';
        newInput.value = '';
        newInput.focus();
      } else {
        newLabel.style.display = 'none';
        newInput.value = '';
      }
    });

    document.getElementById('add-app-form').addEventListener('submit', function(event) {
      event.preventDefault();
      saveAppForm();
    });
    document.getElementById('apps-list').addEventListener('click', function(event) {
      const actionButton = event.target.closest('button[data-action]');
      if (!actionButton) {
        return;
      }

      const index = Number.parseInt(actionButton.dataset.index, 10);
      if (Number.isNaN(index)) {
        return;
      }

      if (actionButton.dataset.action === 'edit') {
        editApp(index);
      } else if (actionButton.dataset.action === 'toggle-hidden') {
        toggleAppHidden(index);
      }
    });
    document.getElementById('main-content').addEventListener('click', function(event) {
      const appCard = event.target.closest('.app-card');
      if (!appCard) {
        return;
      }

      const url = appCard.dataset.appUrl;
      const appName = appCard.dataset.appName || '';
      if (url) {
        openApp(url, appName);
      }
    });

    // Close modals when clicking outside
    window.addEventListener('click', function(event) {
      if (event.target.classList.contains('modal')) {
        setModalOpen(event.target.id, false);
      }
    });

    function openApp(url, appName) {
      const themes = {
        dark: { primary: '#60a5fa', background: '#1e293b', text: '#e2e8f0', surface: '#334155' },
        light: { primary: '#3b82f6', background: '#f8fafc', text: '#1e293b', surface: '#ffffff' },
        ocean: { primary: '#22d3ee', background: '#0c4a6e', text: '#cffafe', surface: '#164e63' },
        sunset: { primary: '#fb923c', background: '#431407', text: '#fed7aa', surface: '#7c2d12' },
        forest: { primary: '#4ade80', background: '#14532d', text: '#dcfce7', surface: '#166534' },
        neon: { primary: '#f0abfc', background: '#0a0a0a', text: '#f5f5f5', surface: '#1a1a2e' },
        rose: { primary: '#fb7185', background: '#4c0519', text: '#ffe4e6', surface: '#881337' },
        midnight: { primary: '#818cf8', background: '#0f0f23', text: '#e0e7ff', surface: '#1a1a3e' },
        cyberpunk: { primary: '#facc15', background: '#0a0a0a', text: '#fef08a', surface: '#1c1917' },
        retro: { primary: '#4ade80', background: '#0a0a0a', text: '#4ade80', surface: '#111111' },
        nord: { primary: '#88c0d0', background: '#2e3440', text: '#eceff4', surface: '#3b4252' },
        dracula: { primary: '#bd93f9', background: '#282a36', text: '#f8f8f2', surface: '#44475a' },
        solarized: { primary: '#268bd2', background: '#002b36', text: '#839496', surface: '#073642' },
        glass: { primary: '#93c5fd', background: '#1e293b', text: '#e2e8f0', surface: 'rgba(51,65,85,0.6)' },
        lavender: { primary: '#c4b5fd', background: '#2e1065', text: '#ede9fe', surface: '#3b0764' },
        coffee: { primary: '#d97706', background: '#292018', text: '#fde68a', surface: '#3b2a1a' },
        arctic: { primary: '#e0f2fe', background: '#0c4a6e', text: '#f0f9ff', surface: '#075985' },
        custom: config.customColors
      };
      const colors = themes[config.theme] || themes.dark;
      window.electronAPI.openApp(url, appName, colors);
    }
  </script>
</body>
